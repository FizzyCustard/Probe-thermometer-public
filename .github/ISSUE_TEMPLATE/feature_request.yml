name: Feature request
description: Suggest an idea for the thermometer or dashboard
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem you want solved, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
  - type: checkboxes
    id: hardware
    attributes:
      label: Hardware
      options:
        - label: This needs new or different hardware
